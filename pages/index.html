<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabe Software — Inicio</title>
  <link rel="stylesheet" href="/logic/css/styles.css">
  <link rel="stylesheet" href="/logic/css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <!-- Hero -->
    <section id="home" class="relative min-h-screen flex items-center justify-center overflow-hidden bg-slate-950 pt-20">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,0.25),transparent_60%)]"></div>
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom_right,rgba(236,72,153,0.18),transparent_55%)]"></div>

      <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-indigo-600/30 rounded-full blur-3xl blob"></div>
      <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-purple-600/25 rounded-full blur-3xl blob blob-delay"></div>

      <div class="absolute inset-0 bg-grid opacity-20"></div>

      <div class="relative z-10 container mx-auto px-4 md:px-8 text-center text-white">
        <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-indigo-400/40 bg-indigo-500/10 text-indigo-200 text-sm font-medium mb-6 animate-fade-in">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span data-field="hero_badge"></span>
        </span>

        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-tight mb-6 animate-fade-in">
          <span data-field="hero_title_part1"></span>
          <span data-field="hero_title_gradient" class="block text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400"></span>
          <span data-field="hero_title_part2"></span>
        </h1>

        <p data-field="hero_subtitle" class="text-lg md:text-xl text-slate-300 max-w-2xl mx-auto mb-10 leading-relaxed animate-fade-in"></p>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16 animate-fade-in">
          <a href="/products" class="group inline-flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-indigo-500/40 hover:shadow-indigo-500/60 transition-all hover:-translate-y-1">
            <i class="fas fa-rocket"></i>
            Explorar productos
            <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
          </a>
          <a href="/about" class="inline-flex items-center gap-2 border border-white/20 hover:border-white/40 bg-white/5 hover:bg-white/10 text-white font-semibold px-8 py-4 rounded-xl transition-all">
            <i class="fas fa-circle-play"></i>
            Conócenos
          </a>
        </div>

        <div id="stats-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-3xl mx-auto animate-fade-in"></div>
      </div>

      <a href="#intro" class="absolute bottom-8 left-1/2 -translate-x-1/2 text-slate-400 hover:text-white transition-colors animate-bounce">
        <i class="fas fa-chevron-down text-2xl"></i>
      </a>
    </section>

    <!-- Introducción -->
    <section id="intro" class="relative py-24 bg-slate-900 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(99,102,241,0.12),transparent_60%)]"></div>
      <div class="relative z-10 container mx-auto px-4 md:px-8 text-center">
        <span data-field="intro_eyebrow" class="inline-block text-indigo-400 text-sm font-semibold tracking-widest uppercase mb-3"></span>
        <h2 data-field="intro_title" class="text-4xl md:text-5xl font-extrabold text-white mb-6"></h2>
        <p data-field="intro_text" class="text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed mb-10"></p>
        <a href="/about" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl transition-all hover:-translate-y-0.5">
          Conocer nuestra historia
          <i class="fas fa-arrow-right text-sm"></i>
        </a>
      </div>
    </section>

    <!-- Productos destacados -->
    <section class="relative py-24 bg-slate-950 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,rgba(168,85,247,0.15),transparent_55%)]"></div>
      <div class="relative z-10 container mx-auto px-4 md:px-8">
        <div class="text-center mb-16">
          <span data-field="products_eyebrow" class="inline-block text-purple-400 text-sm font-semibold tracking-widest uppercase mb-3"></span>
          <h2 data-field="products_title" class="text-4xl md:text-5xl font-extrabold text-white mb-6"></h2>
        </div>

        <div data-products="preview" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
      </div>
    </section>

    <!-- CTA -->
    <section class="relative py-24 bg-slate-900 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom_left,rgba(99,102,241,0.18),transparent_55%)]"></div>
      <div class="relative z-10 container mx-auto px-4 md:px-8 text-center">
        <h2 data-field="cta_title" class="text-4xl md:text-5xl font-extrabold text-white mb-6"></h2>
        <p data-field="cta_text" class="text-lg text-slate-400 max-w-2xl mx-auto mb-10"></p>
        <a href="/contact" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-indigo-500/40 transition-all hover:-translate-y-1">
          <i class="fas fa-paper-plane"></i>
          Contactar
        </a>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/logic/js/loader.js" defer></script>
  <script src="/logic/js/data.js" defer></script>
</body>
</html>
