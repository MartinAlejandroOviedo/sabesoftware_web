<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabe Software — Contacto</title>
  <link rel="stylesheet" href="/logic/css/styles.css">
  <link rel="stylesheet" href="/logic/css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <!-- Encabezado de página -->
    <section class="relative pt-32 pb-20 bg-slate-900 overflow-hidden">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_bottom_left,rgba(99,102,241,0.18),transparent_60%)]"></div>
      <div class="relative z-10 container mx-auto px-4 md:px-8 text-center">
        <span data-field="contact_eyebrow" class="inline-block text-emerald-400 text-sm font-semibold tracking-widest uppercase mb-3"></span>
        <h1 data-field="contact_title" class="text-4xl md:text-5xl font-extrabold text-white mb-6"></h1>
        <p data-field="contact_text" class="text-lg text-slate-400 max-w-2xl mx-auto"></p>
      </div>
    </section>

    <!-- Formulario e info -->
    <section class="relative py-24 bg-slate-950 overflow-hidden">
      <div class="relative z-10 container mx-auto px-4 md:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 max-w-5xl mx-auto">
          <div class="lg:col-span-2 space-y-4">
            <div class="feature-card rounded-2xl border border-white/10 bg-white/5 p-6 flex items-start gap-4">
              <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-lg shrink-0">
                <i class="fas fa-envelope"></i>
              </div>
              <div>
                <h3 class="font-semibold text-white mb-1">Email</h3>
                <p data-field="contact_email" class="text-slate-400"></p>
              </div>
            </div>
            <div class="feature-card rounded-2xl border border-white/10 bg-white/5 p-6 flex items-start gap-4">
              <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-lg shrink-0">
                <i class="fas fa-location-dot"></i>
              </div>
              <div>
                <h3 class="font-semibold text-white mb-1">Ubicación</h3>
                <p data-field="contact_location" class="text-slate-400"></p>
              </div>
            </div>
            <div class="feature-card rounded-2xl border border-white/10 bg-white/5 p-6 flex items-start gap-4">
              <div class="w-12 h-12 rounded-xl bg-pink-500/20 text-pink-400 flex items-center justify-center text-lg shrink-0">
                <i class="fas fa-clock"></i>
              </div>
              <div>
                <h3 class="font-semibold text-white mb-1">Horario</h3>
                <p data-field="contact_schedule" class="text-slate-400"></p>
              </div>
            </div>
          </div>

          <form class="lg:col-span-3 rounded-3xl border border-white/10 bg-white/5 p-8 space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-medium text-slate-300 mb-2" for="name">Nombre</label>
                <input id="name" type="text" placeholder="Tu nombre" class="w-full bg-slate-800/60 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-300 mb-2" for="email">Email</label>
                <input id="email" type="email" placeholder="tu@email.com" class="w-full bg-slate-800/60 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-2" for="message">Mensaje</label>
              <textarea id="message" rows="5" placeholder="Cuéntanos sobre tu proyecto..." class="w-full bg-slate-800/60 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-500/40 transition-all hover:-translate-y-0.5">
              <i class="fas fa-paper-plane"></i> Enviar mensaje
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/logic/js/loader.js" defer></script>
  <script src="/logic/js/data.js" defer></script>
</body>
</html>
