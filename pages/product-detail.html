<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabe Software — Producto</title>
  <link rel="stylesheet" href="/logic/css/styles.css">
  <link rel="stylesheet" href="/logic/css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header"></div>

  <main>
    <section id="product-hero" class="relative pt-32 pb-20 bg-slate-900 overflow-hidden hidden">
      <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(99,102,241,0.18),transparent_60%)]"></div>
      <div class="relative z-10 container mx-auto px-4 md:px-8 text-center">
        <span class="inline-block text-indigo-400 text-sm font-semibold tracking-widest uppercase mb-3">Producto</span>
        <h1 id="product-title" class="text-4xl md:text-5xl font-extrabold text-white mb-6"></h1>
        <p id="product-subtitle" class="text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed"></p>
      </div>
    </section>

    <section class="relative py-24 bg-slate-950 overflow-hidden">
      <div class="relative z-10 container mx-auto px-4 md:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
          <!-- Icono y CTA -->
          <div class="lg:col-span-1 flex flex-col items-center text-center">
            <div id="product-icon" class="w-24 h-24 rounded-2xl flex items-center justify-center text-3xl text-white mb-8 shadow-lg"></div>
            <h2 class="text-2xl font-bold text-white mb-4">Características principales</h2>
            <p id="product-description" class="text-slate-400 leading-relaxed mb-8"></p>
            <a href="/contact" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-indigo-500/40 transition-all hover:-translate-y-1">
              <i class="fas fa-paper-plane"></i>
              Solicitar demo
            </a>
          </div>

          <!-- Features list -->
          <div class="lg:col-span-2">
            <h3 class="text-2xl font-bold text-white mb-6">Detalles</h3>
            <ul id="product-features" class="space-y-4"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="/logic/js/loader.js" defer></script>
  <script src="/logic/js/data.js" defer></script>
  <script src="/logic/js/product-detail.js" defer></script>
</body>
</html>
